name: Build macOS App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FreeTubeInstaller.app
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: swift --version

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.1.0+${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Assemble app bundle
        env:
          OUT_DIR: ${{ github.workspace }}/dist
        run: ./scripts/build-app.sh --dist

      - name: Verify bundle
        run: |
          test -d dist/FreeTubeInstaller.app/Contents/MacOS
          test -f dist/FreeTubeInstaller.app/Contents/Info.plist
          test -f "dist/FreeTubeInstaller-macOS/Install FreeTubeInstaller.command"
          codesign --verify --deep --strict dist/FreeTubeInstaller.app
          echo "App bundle OK"

      - name: Package zip
        run: |
          cd dist
          zip -r -q FreeTubeInstaller-macOS.zip FreeTubeInstaller-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTubeInstaller-macOS
          path: dist/FreeTubeInstaller-macOS.zip
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FreeTubeInstaller-macOS.zip
          generate_release_notes: true
          body: |
            > ⚠️ **Ad-hoc signed** (like FreeTube itself). On first launch use the included
            > `Install FreeTubeInstaller.command`, or run:
            >
            > ```
            > xattr -dr com.apple.quarantine ~/Applications/FreeTubeInstaller.app
            > open ~/Applications/FreeTubeInstaller.app
            > ```
            >
            > Or right-click the app → **Open**.
            >
            > See `README.txt` inside the zip for full install instructions.
