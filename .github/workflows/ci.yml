name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f"
          done < <(find . -type f -name '*.sh' ! -path './.git/*' -print0)
      - name: README links
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null; then
            python3 - <<'PY'
import pathlib, re, sys
text = pathlib.Path("README.md").read_text(errors="replace")
broken = []
for _label, href in re.findall(r"\[([^\]]+)\]\(([^)]+)\)", text):
    if href.startswith(("http://", "https://", "mailto:", "#")):
        continue
    path = href.split("#")[0].split("?")[0]
    if path and not (pathlib.Path(".") / path).exists():
        broken.append(href)
if broken:
    print("Broken relative links:", broken)
    sys.exit(1)
print("README relative links OK")
PY
          fi
