<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="upd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="ft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="np" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="700">FreeTube · macOS music system</text>
  <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">one command installs everything, then it keeps itself current</text>

  <!-- LaunchAgents rail -->
  <g font-size="12" fill="#cbd5e1">
    <text x="40" y="150" fill="#94a3b8" font-weight="600">LAUNCHAGENTS</text>
    <text x="40" y="176">autoupdate</text>
    <text x="40" y="196">topmusic</text>
    <text x="40" y="216">bar (menu bar)</text>
    <text x="40" y="236">resume (login)</text>
  </g>

  <!-- Tier 1: sources -->
  <g filter="url(#shadow)">
    <rect x="180" y="112" width="300" height="96" rx="12" fill="url(#src)"/>
    <rect x="180" y="112" width="300" height="96" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
  </g>
  <text x="330" y="150" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">iTunes Top-100</text>
  <text x="330" y="172" text-anchor="middle" fill="#e0e7ff" font-size="12">genre charts (key-free)</text>
  <text x="330" y="190" text-anchor="middle" fill="#e0e7ff" font-size="12">Pop · Rap · Rock · Latin …</text>

  <g filter="url(#shadow)">
    <rect x="720" y="112" width="300" height="96" rx="12" fill="url(#src)"/>
  </g>
  <text x="870" y="150" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Invidious</text>
  <text x="870" y="172" text-anchor="middle" fill="#e0e7ff" font-size="12">search → YouTube video</text>
  <text x="870" y="190" text-anchor="middle" fill="#e0e7ff" font-size="12">official video + viewCount</text>

  <!-- Tier 2: updater -->
  <g filter="url(#shadow)">
    <rect x="300" y="286" width="600" height="110" rx="12" fill="url(#upd)"/>
  </g>
  <text x="600" y="326" text-anchor="middle" fill="#062a3a" font-size="17" font-weight="700">update-top-music.py  ·  every 6 h (when FreeTube is closed)</text>
  <text x="600" y="352" text-anchor="middle" fill="#082f40" font-size="13">matches songs → official YouTube videos (viewCount-ranked) → writes</text>
  <g font-size="13" fill="#04222e" font-weight="600">
    <text x="420" y="378" text-anchor="middle">playlists.db</text>
    <text x="770" y="378" text-anchor="middle">top-charts.json</text>
  </g>

  <!-- Tier 3: bar -->
  <g filter="url(#shadow)">
    <rect x="300" y="470" width="600" height="110" rx="12" fill="url(#bar)"/>
  </g>
  <text x="600" y="510" text-anchor="middle" fill="#3b1d05" font-size="17" font-weight="700">FreeTubeBar  ♫  (menu bar app)</text>
  <text x="600" y="536" text-anchor="middle" fill="#4a2607" font-size="13">Now Playing popover · Genre / Shuffle menu · Resume-on-login</text>
  <text x="600" y="558" text-anchor="middle" fill="#4a2607" font-size="13">reads top-charts.json</text>

  <!-- Tier 4: FreeTube + Now Playing -->
  <g filter="url(#shadow)">
    <rect x="300" y="654" width="270" height="78" rx="12" fill="url(#ft)"/>
  </g>
  <text x="435" y="690" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">FreeTube.app</text>
  <text x="435" y="710" text-anchor="middle" fill="#ffe4e6" font-size="12">plays + autoplays</text>

  <g filter="url(#shadow)">
    <rect x="630" y="654" width="270" height="78" rx="12" fill="url(#np)"/>
  </g>
  <text x="765" y="690" text-anchor="middle" fill="#03251a" font-size="16" font-weight="700">macOS Now Playing</text>
  <text x="765" y="710" text-anchor="middle" fill="#052e20" font-size="12">media keys · Control Center · AirPods</text>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M330,208 C330,246 330,246 330,286"/>
    <path d="M870,208 C870,246 870,246 870,286"/>
    <path d="M600,396 L600,470"/>
    <path d="M470,580 L445,654"/>
    <path d="M745,580 L760,654"/>
    <path d="M765,654 C860,620 860,560 900,470" stroke-dasharray="6 6" stroke="#22d3ee"/>
  </g>
  <text x="905" y="600" fill="#67e8f9" font-size="11" text-anchor="middle">nowplaying-cli</text>
</svg>
