<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b2547"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="0.5" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="330" r="300" fill="url(#glow)"/>

  <!-- ♫ mark -->
  <g transform="translate(600,245)">
    <circle r="86" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <text y="34" text-anchor="middle" font-size="96" fill="url(#accent)">♫</text>
  </g>

  <text x="600" y="395" text-anchor="middle" fill="#eaf0ff" font-size="58" font-weight="800" letter-spacing="-1">FreeTube · macOS Music System</text>
  <text x="600" y="438" text-anchor="middle" fill="#8b96b8" font-size="24">One command → auto-updating FreeTube + 18 top-charts genres + ♫ menu bar</text>

  <g transform="translate(600,498)" font-size="15" fill="#cdd6f4">
    <rect x="-318" y="-20" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="-234" y="2" text-anchor="middle">18 genres</text>
    <rect x="-132" y="-20" width="186" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="-39" y="2" text-anchor="middle">Radio Mix</text>
    <rect x="72" y="-20" width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="172" y="2" text-anchor="middle">AirPods auto-pause</text>
  </g>

  <text x="600" y="586" text-anchor="middle" fill="#66709a" font-size="18">zeroxshdw.github.io/freetube-install</text>
</svg>
