<svg xmlns="http://www.w3.org/2000/svg" width="420" height="470" viewBox="0 0 420 470" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <!-- menu bar strip -->
  <rect x="0" y="0" width="420" height="34" fill="#161b28"/>
  <rect x="0" y="33" width="420" height="1" fill="#000" fill-opacity="0.5"/>
  <circle cx="392" cy="17" r="11" fill="#1f2738"/>
  <text x="392" y="23" text-anchor="middle" fill="#f59e0b" font-size="14">♫</text>

  <!-- dropdown menu -->
  <rect x="150" y="40" width="262" height="420" rx="10" fill="#222a3d"/>
  <rect x="150" y="40" width="262" height="420" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g fill="#eaf0ff">
    <text x="166" y="68" font-size="13" font-weight="700">FreeTube</text>
    <text x="166" y="92" fill="#8b96b8" font-size="12">Now Playing: Track Title</text>
  </g>
  <line x1="150" y1="102" x2="412" y2="102" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-size="13" fill="#cdd6f4">
    <text x="166" y="128">Play / Pause</text>
    <text x="166" y="154">Next Track</text>
    <text x="166" y="180">Previous Track</text>
    <text x="166" y="206" fill="#f59e0b">Shuffle All Genres</text>
  </g>
  <line x1="150" y1="216" x2="412" y2="216" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="166" y="242" font-size="13" fill="#eaf0ff">Genres ▸</text>
  <g font-size="12" fill="#8b96b8">
    <text x="184" y="264">Pop</text>
    <text x="184" y="284">Hip-Hop/Rap</text>
    <text x="184" y="304">Rock</text>
    <text x="184" y="324">Latin</text>
    <text x="184" y="344">Electronic</text>
    <text x="184" y="364">… 13 more</text>
  </g>

  <line x1="150" y1="376" x2="412" y2="376" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-size="13" fill="#cdd6f4">
    <text x="166" y="400" fill="#ec4899">♥ Favorites ▸</text>
    <text x="166" y="426" fill="#60a5fa">🕓 Watch Later ▸</text>
    <text x="166" y="452">✓ Resume last genre on login</text>
  </g>
</svg>
