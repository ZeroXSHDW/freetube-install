<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="360" height="400" rx="18" fill="#1a2030"/>
  <rect width="360" height="400" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- album art -->
  <rect x="120" y="34" width="120" height="120" rx="12" fill="url(#art)"/>
  <text x="180" y="112" text-anchor="middle" font-size="48" fill="#fff" opacity="0.9">♫</text>

  <text x="180" y="182" text-anchor="middle" fill="#eaf0ff" font-size="16" font-weight="700">Now Playing — Track Title</text>
  <text x="180" y="204" text-anchor="middle" fill="#8b96b8" font-size="13">Artist Name</text>

  <!-- scrub bar -->
  <rect x="30" y="228" width="300" height="5" rx="2.5" fill="#2a3350"/>
  <rect x="30" y="228" width="120" height="5" rx="2.5" fill="#f59e0b"/>
  <circle cx="150" cy="230.5" r="8" fill="#f59e0b"/>
  <text x="30" y="252" fill="#8b96b8" font-size="11">1:24</text>
  <text x="330" y="252" text-anchor="end" fill="#8b96b8" font-size="11">3:45</text>

  <!-- controls -->
  <g fill="#cdd6f4" font-size="26" text-anchor="middle">
    <text x="90" y="330">⏮</text>
    <circle cx="180" cy="312" r="26" fill="#f59e0b"/>
    <text x="180" y="323" fill="#0b1020">▶</text>
    <text x="270" y="330">⏭</text>
  </g>
  <g fill="#cdd6f4" font-size="18" text-anchor="middle">
    <text x="120" y="372">🔀</text>
    <text x="240" y="372" fill="#ec4899">♥</text>
  </g>
</svg>
